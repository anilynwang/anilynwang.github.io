media:
  - name: article_images
    label: 文章图片
    input: public/images
    output: /images

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
      field: false
    view:
      fields: [title, recommended, published, draft]
      primary: title
      sort: [published, title]
      search: [title, body]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: 署名
        type: string
        description: 作品实际作者或笔名；留空显示未署名。
      - name: recommended
        label: 作者推荐
        type: boolean
        default: false
        description: 开启后排在首页最前面；多篇推荐文章按发布日期从新到旧排列。
      - name: genre
        label: 文体
        type: select
        options:
          values: [散文, 随笔, 小说, 诗歌, 评论, 书信, 日记, 其他]
      - name: updated
        label: 修改日期（选填）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: description
        label: 摘要（选填）
        type: text
      - name: tags
        label: 标签（选填）
        type: string
        list: true
      - name: draft
        label: 保存为草稿，不公开
        type: boolean
        default: false
      - name: lang
        label: 语言
        type: select
        default: zh
        options:
          values:
            - name: zh
              label: 中文
      - name: abbrlink
        label: 固定网址标识（选填）
        type: string
        description: 已有文章请保持原值，修改会改变网址。新文章留空即可。
        pattern: "^[a-z0-9-]*$"
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          media: article_images
          switcher: true
